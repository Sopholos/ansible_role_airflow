---

- name: Airflow | Scheduler watchdog script
  ansible.builtin.template:
    src: airflow-scheduler-watchdog.sh.j2
    dest: "{{ airflow_scheduler_watchdog_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Airflow | Scheduler watchdog units
  ansible.builtin.template:
    src: "airflow-scheduler-watchdog.{{ item }}.j2"
    dest: "/etc/systemd/system/airflow-scheduler-watchdog.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer

- name: Airflow | Scheduler watchdog timer enabled
  ansible.builtin.systemd:
    name: airflow-scheduler-watchdog.timer
    state: started
    enabled: true
    daemon_reload: true
